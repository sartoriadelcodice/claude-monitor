name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -ntp test

  frontend:
    name: Frontend build and translations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run i18n:check
      # Without PRIMENG_LICENSE the build only warns: the key is never needed in CI
      - run: npm run build

  scripts:
    name: Hook and script syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Bash syntax
        run: for f in hooks/*.sh scripts/*.sh; do bash -n "$f"; done
      - name: PowerShell syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem hooks/*.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$null, [ref]$errors) | Out-Null
            foreach ($e in $errors) { Write-Error "$($file.Name): $($e.Message)"; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Docker Compose configuration
        run: |
          cp .env.example .env
          sed -i 's/^ADMIN_PASSWORD=$/ADMIN_PASSWORD=ci/; s/^JWT_SECRET=$/JWT_SECRET=ci-secret-ci-secret-ci-secret-ci-secret/' .env
          docker compose config -q
