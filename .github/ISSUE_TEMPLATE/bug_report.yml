name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please remove hook keys, host names and project names you don't want to share.
        Security issues go to the [private advisory form](https://github.com/sartoriadelcodice/claude-monitor/security/advisories/new) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a Claude Code session on ...
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Claude Monitor version
      description: Shown in the dashboard settings, e.g. "0.7.0 build 20261111-1830".
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Dashboard / PWA
        - Sounds
        - Push notifications
        - Hook (macOS / Linux)
        - Hook (Windows)
        - Window focus agent (macOS)
        - Backend / API
        - Installation / Docker
        - Translations
  - type: input
    id: environment
    attributes:
      label: Device, browser and operating system
      placeholder: iPad Pro, iPadOS 26.1, installed PWA
  - type: input
    id: claude-code
    attributes:
      label: Claude Code version
      description: Output of `claude --version`, if the bug involves the hooks.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output of `docker compose logs backend` or of the browser console.
      render: text
