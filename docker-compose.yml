# Claude Monitor: backend, frontend (nginx) and PostgreSQL.
# The frontend is the only entry point: put it behind an HTTPS reverse proxy.
# For local testing with public HTTPS: docker compose --profile tunnel up -d
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: claude_monitor
      POSTGRES_USER: claude_monitor
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claude_monitor -d claude_monitor"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/claude_monitor
      DB_USER: claude_monitor
      DB_PASSWORD: ${DB_PASSWORD}
      # Optional: old shared token, imported as a hook key of the administrator
      HOOK_TOKEN: ${HOOK_TOKEN:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in the .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file}
      JWT_TTL: ${JWT_TTL:-30d}
      STALE_AFTER: ${STALE_AFTER:-30m}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    ports:
      # Local only, for frontend development with ng serve
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      # The context is the repository root: the build includes the scripts in hooks/, downloadable from the dashboard
      context: .
      dockerfile: frontend/Dockerfile
      args:
        PRIMENG_LICENSE: ${PRIMENG_LICENSE:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8088}:80"

  # Cloudflare tunnel for local testing ("tunnel" profile), managed from the Cloudflare dashboard:
  # the public hostname and the target service (http://frontend:80) are configured there.
  # http2 protocol forced: QUIC (UDP) is often blocked or unstable.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - frontend
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLAUDE_MONITOR_TUNNEL_TOKEN:-}

volumes:
  postgres-data:
