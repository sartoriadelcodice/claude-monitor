<!doctype html>
<html lang="en" class="app-dark">
  <head>
    <meta charset="utf-8" />
    <title>Claude Monitor</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Live dashboard of your Claude Code sessions across machines, with sound alerts and push notifications." />
    <meta name="theme-color" content="#0b0f17" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Claude Monitor" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Theme and language applied before the app starts, to avoid a flash of the dark theme.
      // Same key, colors and language rules as SettingsService and I18n.
      try {
        var settings = JSON.parse(localStorage.getItem('cm.settings') || '{}');
        if (settings.theme === 'light') {
          document.documentElement.classList.remove('app-dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f3f5f9');
        }
        var language = settings.language && settings.language !== 'auto' ? settings.language
          : (navigator.languages || [navigator.language]).map(function (tag) { return String(tag).toLowerCase().split('-')[0]; })
              .filter(function (base) { return base === 'en' || base === 'it'; })[0];
        document.documentElement.lang = language || 'en';
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Claude Monitor requires JavaScript. · Claude Monitor richiede JavaScript.</noscript>
  </body>
</html>
