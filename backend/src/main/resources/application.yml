spring:
  application:
    name: claude-monitor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claude_monitor}
    username: ${DB_USER:claude_monitor}
    password: ${DB_PASSWORD:claude_monitor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  messages:
    basename: messages
    # A language without its own file falls back to messages.properties (English), not to the JVM locale
    fallback-to-system-locale: false

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

monitor:
  # Shared token used by the Claude Code hooks (header Authorization: Bearer ...)
  hook-token: ${HOOK_TOKEN:}
  auth:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    # HMAC secret used to sign the JWTs: at least 32 characters
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:30d}
  sessions:
    # How long a session can go without events before it becomes STALE
    stale-after: ${STALE_AFTER:30m}
  push:
    # VAPID keys in base64url; if empty, push notifications are disabled
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:admin@example.com}
