spring:
  application:
    name: claude-monitor
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/claude_monitor}
    username: ${DB_USER:claude_monitor}
    password: ${DB_PASSWORD:claude_monitor}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 8080
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

monitor:
  # Token condiviso usato dagli hook di Claude Code (header Authorization: Bearer ...)
  hook-token: ${HOOK_TOKEN:}
  auth:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
    # Segreto HMAC per firmare i JWT: almeno 32 caratteri
    jwt-secret: ${JWT_SECRET:}
    jwt-ttl: ${JWT_TTL:30d}
  sessions:
    # Dopo quanto tempo senza eventi una sessione diventa STALE
    stale-after: ${STALE_AFTER:30m}
  push:
    # Chiavi VAPID in base64url; se vuote le notifiche push sono disattivate
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}
    vapid-subject: ${VAPID_SUBJECT:mailto:admin@example.com}
